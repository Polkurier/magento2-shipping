<div class="polkurier-section__part polkurier-point-box" if="shown">
    <div class="polkurier-muted" translate="'Pickup point'"></div>
    <!-- ko if: pointId -->
    <div class="polkurier-point-box__row">
        <strong class="polkurier-code" text="pointId"></strong>
        <button type="button" class="action-default polkurier-compact-button" click="change">
            <span translate="'Change'"></span>
        </button>
        <button type="button" class="action-default polkurier-compact-button" ifnot="required" click="remove">
            <span translate="'Remove'"></span>
        </button>
    </div>
    <div class="polkurier-muted" if="label" text="label"></div>
    <!-- Bound through $t: a colon in a translate attribute is read as binding syntax. -->
    <div class="polkurier-text-error" if="closed" data-bind="text: $t('Closed or no longer there: choose another point.')"></div>
    <!-- /ko -->
    <!-- ko ifnot: pointId -->
    <div data-bind="css: {'polkurier-text-error': missing, 'polkurier-muted': !missing()}">
        <span data-bind="text: required() ? $t('This carrier delivers to pickup points only: choose one.') : $t('To the door (no pickup point)')"></span>
    </div>
    <button type="button" class="action-secondary" if="canChoose" click="chooseOnMap">
        <span translate="'Choose on map'"></span>
    </button>
    <button type="button" class="polkurier-link" ifnot="canChoose" click="edit">
        <span translate="'Enter the point code'"></span>
    </button>
    <!-- /ko -->
</div>
