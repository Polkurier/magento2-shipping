<div class="polkurier-section__part polkurier-items">
    <!-- ko if: canShip -->
    <table class="data-table admin__table-primary polkurier-items__table">
        <thead>
        <tr>
            <th translate="'Product'"></th>
            <th class="polkurier-items__number" translate="'Ordered'"></th>
            <th class="polkurier-items__number" translate="'Shipped'"></th>
            <th class="polkurier-items__qty" translate="'To ship'"></th>
        </tr>
        </thead>
        <tbody data-bind="foreach: rows">
        <tr>
            <td>
                <div text="name"></div>
                <div class="polkurier-muted" text="sku"></div>
            </td>
            <td class="polkurier-items__number" text="ordered"></td>
            <td class="polkurier-items__number" text="shipped"></td>
            <td class="polkurier-items__qty">
                <input type="number" class="admin__control-text" min="0" step="any"
                       data-bind="value: qty, attr: {max: left, 'aria-label': label}, css: {'_error': invalid}"/>
                <span class="polkurier-muted" text="leftText"></span>
            </td>
        </tr>
        </tbody>
    </table>
    <!-- /ko -->
    <!-- ko if: !canShip() && replacingText() -->
    <p text="replacingText"></p>
    <!-- /ko -->
    <!-- ko if: !canShip() && !replacingText() -->
    <p class="polkurier-muted" translate="'Everything on the order is shipped, and each of its Magento shipments has its Polkurier order. To send a replacement, cancel the Polkurier order it replaces first.'"></p>
    <!-- /ko -->
</div>
