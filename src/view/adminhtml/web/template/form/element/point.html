<!-- A point's code with "Choose on map" and "Remove" next to it, and its name and address below -->
<div class="polkurier-point-input">
    <input class="admin__control-text" type="text"
           data-bind="
               event: {change: userChanges},
               value: value,
               hasFocus: focused,
               valueUpdate: valueUpdate,
               attr: {
                   name: inputName,
                   placeholder: placeholder,
                   'aria-describedby': noticeId,
                   id: uid,
                   disabled: disabled
               }"/>
    <button type="button" class="action-default" if="canChoose()" click="choose" disable="disabled">
        <span translate="'Choose on map'"></span>
    </button>
    <button type="button" class="action-default" if="value" click="remove" disable="disabled">
        <span translate="'Remove'"></span>
    </button>
</div>
<div class="polkurier-point-details" if="details" text="details"></div>
