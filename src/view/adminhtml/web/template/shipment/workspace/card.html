<section class="polkurier-card" data-bind="visible: shown, css: {'_attention': attention}">
    <header class="polkurier-card__header">
        <h3 class="polkurier-card__title" text="title"></h3>
        <button type="button" class="action-tertiary polkurier-card__edit" click="edit">
            <span translate="'Change'"></span>
        </button>
    </header>
    <ul class="polkurier-card__lines">
        <!-- ko foreach: lines -->
        <li data-bind="text: text, css: {'_muted': muted, '_strong': strong, '_tag': tag}"></li>
        <!-- /ko -->
    </ul>
    <ul class="polkurier-card__issues" if="issues().length">
        <!-- ko foreach: issues -->
        <li data-bind="text: text, css: {'_blocking': blocking}"></li>
        <!-- /ko -->
    </ul>
    <div class="polkurier-card__actions" if="canChoosePoint">
        <button type="button" class="action-secondary" click="chooseOnMap">
            <span translate="'Choose a point on the map'"></span>
        </button>
    </div>
</section>
