<div class="admin__field">
    <div class="admin__field-label"></div>
    <div class="admin__field-control">
        <button type="button" class="action-secondary" click="run" disable="loading">
            <span text="buttonLabel"></span>

            <span text="message"></span>
        </div>
    </div>
</div>
