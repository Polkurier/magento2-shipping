<section class="admin__page-section polkurier-section polkurier-templates">
    <div class="admin__page-section-title">
        <span class="title" translate="'Pack templates'"></span>
    </div>
    <div class="admin__page-section-content">
        <ul class="polkurier-templates__list">
            <li class="polkurier-templates__item" tabindex="0" role="button"
                data-bind="click: addCustom, event: {keydown: function (d, e) { return onKey(null, e); }}">
                <strong translate="'A parcel without a template'"></strong>
                <span class="polkurier-muted" translate="'Enter its size and weight yourself.'"></span>
            </li>
            <!-- ko foreach: items -->
            <li class="polkurier-templates__item" tabindex="0" role="button"
                data-bind="css: {'_active': id === $parent.active()},
                           click: $parent.choose.bind($parent),
                           event: {keydown: $parent.onKey.bind($parent)}">
                <strong text="name"></strong>
                <span class="polkurier-muted" data-bind="text: pack_type_label + ' (' + length + ' × ' + width + ' × ' + height + ' cm, ' + weight + ' kg)'"></span>
            </li>
            <!-- /ko -->
        </ul>
        <div class="message message-notice" if="!items().length">
            <span translate="'You have no pack templates yet.'"></span>
            <a data-bind="attr: {href: settingsUrl}" target="_blank" translate="'Add one'"></a>
        </div>
        <div class="message message-notice" if="items().length && !hasDefault()">
            <span translate="'No template is marked as the default for new shipments.'"></span>
            <a data-bind="attr: {href: settingsUrl}" target="_blank" translate="'Choose one'"></a>
        </div>
    </div>
</section>
