<div class="polkurier-carriers">
    <input type="search" class="admin__control-text polkurier-carriers__search"
           data-bind="textInput: search, attr: {placeholder: searchPlaceholder, 'aria-label': searchPlaceholder}"/>
    <div class="polkurier-carriers__status" if="quoting">
        <span translate="'Updating prices…'"></span>
    </div>
    <ul class="polkurier-carriers__list" role="listbox" data-bind="attr: {'aria-label': label}">
        <!-- ko foreach: tiles -->
        <li class="polkurier-carriers__item" role="option" tabindex="0"
            data-bind="css: {'_selected': selected, '_unpriced': !priced, '_cheapest': cheapest},
                       attr: {'aria-selected': selected ? 'true' : 'false'},
                       click: $parent.choose.bind($parent),
                       event: {keydown: $parent.onKey.bind($parent)}">
            <span class="polkurier-carriers__name" text="name"></span>
            <span class="polkurier-carriers__price">
                <strong text="priceText"></strong>
                <span class="polkurier-muted" if="grossText" text="grossText"></span>
            </span>
            <span class="polkurier-carriers__lacking polkurier-muted" if="lacking" text="lacking"></span>
            <span class="polkurier-carriers__meta">
                <span class="polkurier-badge" if="pointOnly" translate="'Points only'"></span>
                <span class="polkurier-badge" if="point && !pointOnly" translate="'Points'"></span>
                <span class="polkurier-badge" if="cod" translate="'COD'"></span>
                <span class="polkurier-badge _cheapest" if="cheapest" translate="'Cheapest'"></span>
            </span>
        </li>
        <!-- /ko -->
    </ul>
    <button type="button" class="action-tertiary polkurier-carriers__more" if="hiddenCount() > 0 || showAll()"
            click="toggleAll">
        <!-- ko if: showAll -->
        <span translate="'Only carriers that can take it'"></span>
        <!-- /ko -->
        <!-- ko ifnot: showAll -->
        <span data-bind="text: $t('Show %1 more').replace('%1', hiddenCount())"></span>
        <!-- /ko -->
    </button>
</div>
