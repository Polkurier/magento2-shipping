<!--
 ~ A copy of Magento_Checkout/shipping-address/shipping-method-item, the same from Magento_Checkout
 ~ 100.4.7 (Magento 2.4.7) to 100.4.9 (Magento 2.4.9), plus the carrier's logo, and the pickup point in
 ~ the carrier's cell, which the module's methods leave empty. Compare it with the new original when
 ~ upgrading Magento: changes there don't reach this copy.
-->
<tr class="row"
    click="element.selectShippingMethod">
    <td class="col col-method">
        <input type="radio"
               class="radio"
               ifnot="method.error_message"
               ko-checked="element.isSelected"
               ko-value="method.carrier_code + '_' + method.method_code"
               attr="'aria-labelledby': 'label_method_' + method.method_code + '_' + method.carrier_code + ' ' + 'label_carrier_' + method.method_code + '_' + method.carrier_code,
                    'checked': element.rates().length == 1 || element.isSelected" />
    </td>
    <!-- ko ifnot: (method.error_message) -->
    <td class="col col-price">
        <each args="element.getRegion('price')" render=""></each>
    </td>
    <!-- /ko -->
    <td class="col col-method"
        attr="'id': 'label_method_' + method.method_code + '_' + method.carrier_code">
        <img class="shipping-method-logo" alt="" loading="lazy"
             if="method.extension_attributes && method.extension_attributes.method_logo"
             attr="src: method.extension_attributes.method_logo"/>
        <span text="method.method_title"></span>
    </td>
    <td class="col col-carrier">
        <!-- The carrier names the radio button: only the carrier, not the point under it. -->
        <span attr="'id': 'label_carrier_' + method.method_code + '_' + method.carrier_code"
              text="method.carrier_title"></span>
        <!-- ko foreach: element.getRegion('pickup-point-choice') -->
        <!-- ko template: { name: getTemplate(), data: {element: $data, method: method} } --><!-- /ko -->
        <!-- /ko -->
    </td>
</tr>
<tr class="row row-error"
    if="method.error_message">
    <td class="col col-error" colspan="4">
        <div role="alert" class="message error">
            <div text="method.error_message"></div>
        </div>
        <span class="no-display">
            <input type="radio"
                   attr="'value' : method.method_code, 'id': 's_method_' + method.method_code">
        </span>
    </td>
</tr>
