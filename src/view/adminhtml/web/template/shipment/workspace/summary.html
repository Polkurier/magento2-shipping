<div class="polkurier-summary">
    <div class="polkurier-summary__price" data-bind="css: {'_loading': quoting}">
        <span class="polkurier-muted" data-bind="text: carrierName() || $t('No carrier chosen')"></span>
        <!-- ko if: price -->
        <strong class="polkurier-summary__gross" text="price().gross"></strong>
        <span class="polkurier-muted" data-bind="text: price().net + ' ' + $t('net')"></span>
        <!-- /ko -->
        <!-- ko ifnot: price -->
        <span class="polkurier-muted" data-bind="text: quoting() ? $t('Pricing…') : (message() || $t('No price yet'))"></span>
        <!-- /ko -->
    </div>
    <div class="message message-notice polkurier-summary__cheaper" if="cheaper">
        <span text="cheaper().text"></span>
        <button type="button" class="polkurier-link" click="useCheaper">
            <span translate="'Switch'"></span>
        </button>
    </div>
</div>
